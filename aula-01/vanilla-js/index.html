<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle Financeiro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="cabecalho">
        <div class="container">
            <h1>Controle Financeiro</h1>
            <p>Organize suas entradas e saídas de forma simples.</p>
        </div>
    </header>

    <main class="container">

        <section class="resumo">

            <div class="card">
                <h2>Saldo</h2>
                <p id="saldo">R$ 0,00</p>
            </div>

            <div class="card entrada">
                <h2>Entradas</h2>
                <p id="totalEntradas">R$ 0,00</p>
            </div>

            <div class="card saida">
                <h2>Saídas</h2>
                <p id="totalSaidas">R$ 0,00</p>
            </div>

        </section>

        <section class="formulario">

            <h2>Adicionar movimentação</h2>

            <form id="formTransacao">

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        placeholder="Ex: Salário"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input
                        type="number"
                        id="valor"
                        placeholder="Ex: 1500"
                        step="0.01"
                        min="0.01"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="tipo">Tipo</label>

                    <select id="tipo" required>
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saída</option>
                    </select>
                </div>

                <button type="submit">
                    Adicionar movimentação
                </button>

            </form>

        </section>

        <section class="transacoes">

            <h2>Movimentações</h2>

            <div id="listaTransacoes">
                <p class="mensagem-vazia">
                    Nenhuma movimentação cadastrada.
                </p>
            </div>

        </section>

    </main>

    <footer>
        <p>Projeto desenvolvido para a disciplina de Frameworks Front-end.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
